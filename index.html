<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kysely</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1c1c1c; --muted:#6b6b6b; --line:#e3e1dc; --accent:#1c1c1c; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  .desc { color: var(--muted); margin: 0 0 28px; white-space: pre-line; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  .q label.title { display:block; font-weight: 600; margin-bottom: 10px; }
  .req { color: var(--err); margin-left: 2px; }
  input[type=text], input[type=email], textarea { width:100%; padding: 10px 12px; border:1px solid var(--line); border-radius: 8px; font: inherit; background:#fff; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .opt { display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
  .scale { display:flex; gap:8px; flex-wrap:wrap; }
  .scale label { flex:1; min-width:44px; text-align:center; border:1px solid var(--line); border-radius:8px; padding:10px 0; cursor:pointer; user-select:none; }
  .scale input { position:absolute; opacity:0; pointer-events:none; }
  .scale input:checked + span { font-weight:700; }
  .scale label:has(input:checked) { background: var(--accent); color:#fff; border-color: var(--accent); }
  .scale-labels { display:flex; justify-content:space-between; color:var(--muted); font-size:.85rem; margin-top:6px; }
  .hp { position:absolute; left:-9999px; }
  button { background: var(--accent); color:#fff; border:0; border-radius: 10px; padding: 14px 22px; font: inherit; font-weight:600; cursor:pointer; width:100%; margin-top: 8px; }
  button:disabled { opacity:.5; cursor: default; }
  .error { color: var(--err); font-size:.9rem; margin-top:8px; }
  .q.invalid { border-color: var(--err); }
  .state { text-align:center; padding: 60px 0; color: var(--muted); }
  .done h1 { margin-bottom: 12px; }
</style>
</head>
<body>
<main id="app"><p class="state">Ladataan…</p></main>

<script>
// ====== ASETUKSET: täytä Supabasen Project URL ja publishable/anon-avain ======
const SUPABASE_URL = "https://fqksurogezjvmlmsgpfw.supabase.co";
const SUPABASE_KEY = "sb_publishable_6mYs1PfkTrT_Izo0nn816g_LbPMcZEU";
// ===========================================================================

const app = document.getElementById("app");
const slug = new URLSearchParams(location.search).get("f") || "";
const headers = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const show = html => { app.innerHTML = html; };

let password = null;
const rpc = (fn, body) => fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(body) })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

async function load(pw) {
  if (!/^[a-z0-9-]{2,60}$/.test(slug)) return show('<p class="state">Lomaketta ei löytynyt.</p>');
  try {
    const form = await rpc("get_form", { p_slug: slug, p_password: pw ?? null });
    if (!form) return show('<p class="state">Lomaketta ei löytynyt tai se on suljettu.</p>');
    if (form.locked) return renderLock(form);
    password = pw ?? null;
    render(form);
  } catch (e) {
    show('<p class="state">Lomakkeen lataus epäonnistui. Yritä hetken kuluttua uudelleen.</p>');
  }
}

function renderLock(form) {
  document.title = form.title;
  show(`
    <h1>${esc(form.title)}</h1>
    <p class="desc">Tämä kysely on suojattu salasanalla.</p>
    <form id="lock" class="q" novalidate>
      <label class="title" for="pw">Salasana</label>
      <input type="text" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false">
      ${form.wrong ? '<div class="error">Väärä salasana. Yritä uudelleen.</div>' : ""}
      <button type="submit">Jatka</button>
    </form>`);
  const pw = document.getElementById("pw"); pw.focus();
  document.getElementById("lock").onsubmit = e => {
    e.preventDefault();
    if (!pw.value.trim()) return;
    const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Tarkistetaan…";
    load(pw.value);
  };
}

function field(q) {
  const req = q.required ? '<span class="req">*</span>' : "";
  const name = esc(q.id);
  let input = "";
  switch (q.type) {
    case "textarea": input = `<textarea name="${name}" id="${name}"></textarea>`; break;
    case "email": input = `<input type="email" name="${name}" id="${name}" autocomplete="email">`; break;
    case "radio":
    case "checkbox":
      input = (q.options || []).map(o => `<label class="opt"><input type="${q.type}" name="${name}" value="${esc(o)}"> ${esc(o)}</label>`).join("");
      break;
    case "scale": {
      const min = q.min ?? 1, max = q.max ?? 5;
      let s = "";
      for (let i = min; i <= max; i++) s += `<label><input type="radio" name="${name}" value="${i}"><span>${i}</span></label>`;
      input = `<div class="scale">${s}</div>` + (q.minLabel || q.maxLabel ? `<div class="scale-labels"><span>${esc(q.minLabel)}</span><span>${esc(q.maxLabel)}</span></div>` : "");
      break;
    }
    default: input = `<input type="text" name="${name}" id="${name}">`;
  }
  return `<div class="q" data-id="${name}"><label class="title" for="${name}">${esc(q.label)}${req}</label>${input}<div class="error" hidden>Vastaa tähän kysymykseen.</div></div>`;
}

function render(form) {
  document.title = form.title;
  show(`
    <h1>${esc(form.title)}</h1>
    ${form.description ? `<p class="desc">${esc(form.description)}</p>` : ""}
    <form id="f" novalidate>
      ${form.questions.map(field).join("")}
      <input class="hp" type="text" name="_website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Lähetä</button>
      <div class="error" id="submitErr" hidden></div>
    </form>`);
  const f = document.getElementById("f");
  const started = Date.now();

  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    if (fd.get("_website") || Date.now() - started < 2000) return; // botit
    const answers = {};
    let firstBad = null;
    for (const q of form.questions) {
      const box = f.querySelector(`.q[data-id="${CSS.escape(q.id)}"]`);
      let v = q.type === "checkbox" ? fd.getAll(q.id) : (fd.get(q.id) ?? "");
      if (typeof v === "string") v = v.trim().slice(0, 5000);
      if (q.type === "scale" && v !== "") v = Number(v);
      let bad = q.required && (v === "" || (Array.isArray(v) && !v.length));
      if (!bad && q.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) bad = true;
      box.classList.toggle("invalid", bad);
      box.querySelector(".error").hidden = !bad;
      if (bad && !firstBad) firstBad = box;
      answers[q.id] = v;
    }
    if (firstBad) return firstBad.scrollIntoView({ behavior: "smooth", block: "center" });

    const btn = f.querySelector("button"), err = document.getElementById("submitErr");
    btn.disabled = true; btn.textContent = "Lähetetään…"; err.hidden = true;
    try {
      const result = await rpc("submit_response", { p_slug: slug, p_password: password, p_answers: answers });
      if (result === "wrong_password") return load(null);
      if (result !== "ok") throw new Error(result);
      show(`<div class="done state"><h1 style="color:var(--ink)">${esc(form.thank_you || "Kiitos vastauksestasi!")}</h1><p>Vastauksesi on tallennettu.</p></div>`);
      scrollTo(0, 0);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Lähetä";
      err.textContent = "Lähetys epäonnistui. Yritä uudelleen."; err.hidden = false;
    }
  });
}

load();
</script>
</body>
</html>
