<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kyselyt – hallinta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1c1c1c; --muted:#6b6b6b; --line:#e3e1dc; --soft:#efede8; --accent:#1c1c1c; --ok:#1f7a44; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; font-size:15px; }
  header { background:var(--card); border-bottom:1px solid var(--line); }
  .bar { max-width:1000px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px; }
  .bar h1 { font-size:1.05rem; margin:0; flex:1; }
  .bar h1 a { color:inherit; text-decoration:none; }
  .who { color:var(--muted); font-size:.9rem; }
  main { max-width:1000px; margin:0 auto; padding:28px 20px 80px; }
  h2 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .spacer { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px; }
  button, .btn { font:inherit; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  button:hover, .btn:hover { background:var(--soft); }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .primary:hover { background:#000; }
  .danger { color:var(--err); }
  .small { padding:5px 10px; font-size:.85rem; }
  button:disabled { opacity:.5; cursor:default; }
  label.f { display:block; font-weight:600; font-size:.88rem; margin:14px 0 6px; }
  input[type=text], input[type=email], input[type=password], input[type=number], textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:70px; resize:vertical; }
  .hint { color:var(--muted); font-size:.82rem; margin-top:4px; }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:99px; background:var(--soft); color:var(--muted); font-weight:600; }
  .badge.open { background:#e3f2e8; color:var(--ok); }
  .formrow { display:flex; align-items:center; gap:14px; }
  .formrow .t { flex:1; min-width:0; }
  .formrow .t b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .formrow .t span { color:var(--muted); font-size:.85rem; }
  .count { text-align:right; min-width:70px; }
  .count b { font-size:1.2rem; display:block; }
  .count span { color:var(--muted); font-size:.75rem; }
  .q { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; background:#fcfcfb; }
  .q .grid { display:grid; grid-template-columns: 1fr 180px; gap:10px; }
  .q .grid4 { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:10px; }
  .q .tools { display:flex; gap:6px; align-items:center; margin-top:10px; }
  .num { color:var(--muted); font-weight:700; font-size:.8rem; margin-bottom:6px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .login { max-width:380px; margin:10vh auto; }
  .err { color:var(--err); font-size:.9rem; margin-top:10px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:.9rem; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:var(--soft); font-weight:600; position:sticky; top:0; }
  .tablewrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .sum { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:12px; margin-bottom:20px; }
  .sum .card h4 { margin:0 0 10px; font-size:.95rem; }
  .barrow { display:grid; grid-template-columns: 1fr 40px; gap:8px; align-items:center; font-size:.85rem; margin:4px 0; }
  .barrow .track { background:var(--soft); border-radius:4px; height:20px; position:relative; overflow:hidden; }
  .barrow .fill { background:var(--accent); height:100%; }
  .barrow .lbl { position:absolute; left:8px; top:1px; color:#fff; mix-blend-mode:difference; white-space:nowrap; }
  .big { font-size:2rem; font-weight:700; }
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; font-size:.9rem; }
  .linkbox { display:flex; gap:8px; }
  .linkbox input { font-family: ui-monospace, monospace; font-size:.85rem; }
  @media (max-width: 640px) { .q .grid, .q .grid4 { grid-template-columns:1fr; } .formrow { flex-wrap:wrap; } }
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="bar">
    <h1><a href="#/">Kyselyt · hallinta</a></h1>
    <span class="who" id="who"></span>
    <button class="small" id="logout">Kirjaudu ulos</button>
  </div>
</header>
<main id="app"><p class="empty">Ladataan…</p></main>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://fqksurogezjvmlmsgpfw.supabase.co";
const SUPABASE_KEY = "sb_publishable_6mYs1PfkTrT_Izo0nn816g_LbPMcZEU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PUBLIC_BASE = new URL("./", location.href).href;

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); };
const fmtDate = d => new Date(d).toLocaleString("fi-FI", { day:"numeric", month:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit" });
const slugify = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
const publicLink = slug => `${PUBLIC_BASE}?f=${slug}`;
const TYPES = { text:"Lyhyt teksti", textarea:"Pitkä teksti", email:"Sähköposti", radio:"Yksi vaihtoehto", checkbox:"Monivalinta", scale:"Asteikko" };

async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Linkki kopioitu"); } catch { prompt("Kopioi linkki:", text); } }

// ---------- Kirjautuminen ----------
function loginView(msg) {
  document.getElementById("hdr").hidden = true;
  app.innerHTML = `
    <div class="login card">
      <h2>Kirjaudu</h2>
      <p class="sub">Kyselylomakkeiden hallinta</p>
      <form id="lf">
        <label class="f" for="em">Sähköposti</label>
        <input type="email" id="em" autocomplete="username" required>
        <label class="f" for="pw">Salasana</label>
        <input type="password" id="pw" autocomplete="current-password" required>
        <div style="margin-top:16px"><button class="primary" style="width:100%;justify-content:center">Kirjaudu sisään</button></div>
        <div class="err" id="lerr">${esc(msg || "")}</div>
      </form>
    </div>`;
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    btn.disabled = false;
    if (error) document.getElementById("lerr").textContent = "Kirjautuminen epäonnistui. Tarkista sähköposti ja salasana.";
    else route();
  };
}
document.getElementById("logout").onclick = async () => { await sb.auth.signOut(); location.hash = "#/"; loginView(); };

async function requireAdmin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { loginView(); return false; }
  const { data, error } = await sb.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
  if (error || !data) { await sb.auth.signOut(); loginView("Tällä tunnuksella ei ole ylläpito-oikeuksia."); return false; }
  document.getElementById("hdr").hidden = false;
  document.getElementById("who").textContent = session.user.email;
  return true;
}

// ---------- Reititys ----------
async function route() {
  if (!(await requireAdmin())) return;
  const [, page, id] = (location.hash || "#/").slice(1).split("/");
  if (page === "edit") return editView(id);
  if (page === "responses") return responsesView(id);
  return listView();
}
window.addEventListener("hashchange", route);

// ---------- Lomakelista ----------
async function listView() {
  app.innerHTML = `<p class="empty">Ladataan…</p>`;
  const { data, error } = await sb.from("forms").select("id,slug,title,is_open,created_at,responses(count)").order("created_at", { ascending: false });
  if (error) { app.innerHTML = `<p class="err">Lataus epäonnistui: ${esc(error.message)}</p>`; return; }
  app.innerHTML = `
    <div class="row" style="margin-bottom:18px"><div><h2>Lomakkeet</h2><p class="sub" style="margin:0">${data.length} lomaketta</p></div><span class="spacer"></span><a class="btn primary" href="#/edit/new">+ Uusi lomake</a></div>
    ${data.length ? data.map(f => {
      const n = f.responses?.[0]?.count ?? 0;
      return `<div class="card formrow">
        <div class="t"><b>${esc(f.title)}</b><span>${f.is_open ? '<span class="badge open">Auki</span>' : '<span class="badge">Suljettu</span>'} · ?f=${esc(f.slug)} · luotu ${fmtDate(f.created_at)}</span></div>
        <div class="count"><b>${n}</b><span>vastausta</span></div>
        <div class="row">
          <a class="btn small" href="#/responses/${f.id}">Vastaukset</a>
          <a class="btn small" href="#/edit/${f.id}">Muokkaa</a>
          <button class="small" data-copy="${esc(f.slug)}">Kopioi linkki</button>
          <a class="btn small" href="${esc(publicLink(f.slug))}" target="_blank" rel="noopener">Avaa ↗</a>
        </div></div>`;
    }).join("") : `<div class="card empty">Ei vielä lomakkeita. Luo ensimmäinen painamalla <b>+ Uusi lomake</b>.</div>`}`;
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(publicLink(b.dataset.copy)));
}

// ---------- Editori ----------
let draft = null;
function newQuestion(type = "text") { return { id: "", type, label: "", required: false, options: type === "radio" || type === "checkbox" ? ["", ""] : undefined }; }

async function editView(id) {
  if (id === "new") {
    draft = { id: null, title: "", slug: "", description: "", thank_you: "Kiitos vastauksestasi!", is_open: true, questions: [newQuestion()], _slugTouched: false, _hasResponses: false };
  } else {
    app.innerHTML = `<p class="empty">Ladataan…</p>`;
    const { data, error } = await sb.from("forms").select("*,responses(count)").eq("id", id).single();
    if (error) { app.innerHTML = `<p class="err">Lomaketta ei löytynyt.</p>`; return; }
    draft = { ...data, questions: structuredClone(data.questions || []), _slugTouched: true, _hasResponses: (data.responses?.[0]?.count ?? 0) > 0 };
    delete draft.responses;
  }
  renderEditor();
}

function qHtml(q, i, total) {
  const opts = q.type === "radio" || q.type === "checkbox";
  return `<div class="q" data-i="${i}">
    <div class="num">KYSYMYS ${i + 1}</div>
    <div class="grid">
      <input type="text" data-k="label" placeholder="Kysymys" value="${esc(q.label)}">
      <select data-k="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    </div>
    ${opts ? `<label class="f">Vaihtoehdot (yksi per rivi)</label><textarea data-k="options" rows="4">${esc((q.options || []).join("\n"))}</textarea>` : ""}
    ${q.type === "scale" ? `<div class="grid4">
      <div><label class="f">Pienin</label><input type="number" data-k="min" value="${q.min ?? 1}"></div>
      <div><label class="f">Suurin</label><input type="number" data-k="max" value="${q.max ?? 5}"></div>
      <div><label class="f">Teksti alussa</label><input type="text" data-k="minLabel" value="${esc(q.minLabel || "")}" placeholder="esim. Huono"></div>
      <div><label class="f">Teksti lopussa</label><input type="text" data-k="maxLabel" value="${esc(q.maxLabel || "")}" placeholder="esim. Erinomainen"></div>
    </div>` : ""}
    <div class="tools">
      <label class="switch"><input type="checkbox" data-k="required" ${q.required ? "checked" : ""}> Pakollinen</label>
      <span class="spacer"></span>
      <button type="button" class="small" data-act="up" ${i === 0 ? "disabled" : ""}>↑</button>
      <button type="button" class="small" data-act="down" ${i === total - 1 ? "disabled" : ""}>↓</button>
      <button type="button" class="small" data-act="dup">Monista</button>
      <button type="button" class="small danger" data-act="del">Poista</button>
    </div>
  </div>`;
}

function renderEditor() {
  const d = draft;
  app.innerHTML = `
    <div class="row" style="margin-bottom:18px"><a class="btn small" href="#/">← Takaisin</a><span class="spacer"></span>
      ${d.id ? `<button class="small danger" id="delForm">Poista lomake</button>` : ""}
      <button class="primary" id="save">Tallenna</button></div>
    <h2>${d.id ? "Muokkaa lomaketta" : "Uusi lomake"}</h2>
    ${d._hasResponses ? `<p class="sub">Lomakkeella on jo vastauksia. Voit muokata tekstejä ja lisätä kysymyksiä vapaasti. Kysymyksen poistaminen piilottaa sen vanhat vastaukset näkymästä.</p>` : `<p class="sub">Täytä tiedot ja lisää kysymykset.</p>`}
    <div class="card">
      <label class="f" for="title">Otsikko</label>
      <input type="text" id="title" value="${esc(d.title)}" placeholder="esim. Asiakastyytyväisyyskysely">
      <label class="f" for="slug">Linkin tunniste</label>
      <input type="text" id="slug" value="${esc(d.slug)}" placeholder="esim. asiakaspalaute">
      <div class="hint">Linkki: <span id="slugPrev">${esc(publicLink(d.slug || "…"))}</span></div>
      <label class="f" for="desc">Kuvaus (valinnainen)</label>
      <textarea id="desc" placeholder="Näytetään otsikon alla">${esc(d.description || "")}</textarea>
      <label class="f" for="ty">Kiitosteksti lähetyksen jälkeen</label>
      <input type="text" id="ty" value="${esc(d.thank_you || "")}">
      <div style="margin-top:16px"><label class="switch"><input type="checkbox" id="open" ${d.is_open ? "checked" : ""}> Lomake on auki vastauksille</label></div>
    </div>
    <h3 style="margin:26px 0 10px">Kysymykset</h3>
    <div id="qs">${d.questions.map((q, i) => qHtml(q, i, d.questions.length)).join("")}</div>
    <div class="row"><button id="addQ">+ Lisää kysymys</button><span class="spacer"></span><button class="primary" id="save2">Tallenna</button></div>
    <div class="err" id="eerr"></div>`;

  const $ = id => document.getElementById(id);
  $("title").oninput = e => { d.title = e.target.value; if (!d._slugTouched) { d.slug = slugify(d.title); $("slug").value = d.slug; $("slugPrev").textContent = publicLink(d.slug || "…"); } };
  $("slug").oninput = e => { d._slugTouched = true; d.slug = slugify(e.target.value); $("slugPrev").textContent = publicLink(d.slug || "…"); };
  $("slug").onblur = e => { e.target.value = d.slug; };
  $("desc").oninput = e => d.description = e.target.value;
  $("ty").oninput = e => d.thank_you = e.target.value;
  $("open").onchange = e => d.is_open = e.target.checked;
  $("addQ").onclick = () => { d.questions.push(newQuestion()); renderEditor(); document.querySelector(`.q[data-i="${d.questions.length - 1}"] input`)?.focus(); };
  $("save").onclick = $("save2").onclick = saveForm;
  if ($("delForm")) $("delForm").onclick = deleteForm;

  $("qs").oninput = $("qs").onchange = e => {
    const box = e.target.closest(".q"); if (!box) return;
    const q = d.questions[+box.dataset.i], k = e.target.dataset.k; if (!k) return;
    if (k === "required") q.required = e.target.checked;
    else if (k === "options") q.options = e.target.value.split("\n");
    else if (k === "min" || k === "max") q[k] = Number(e.target.value);
    else if (k === "type") {
      if (e.type !== "change") return;
      q.type = e.target.value;
      if ((q.type === "radio" || q.type === "checkbox") && !q.options) q.options = ["", ""];
      if (q.type === "scale") { q.min ??= 1; q.max ??= 5; }
      renderEditor();
    } else q[k] = e.target.value;
  };
  $("qs").onclick = e => {
    const act = e.target.dataset.act; if (!act) return;
    const i = +e.target.closest(".q").dataset.i, qs = d.questions;
    if (act === "up") [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]];
    if (act === "down") [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]];
    if (act === "dup") qs.splice(i + 1, 0, { ...structuredClone(qs[i]), id: "" });
    if (act === "del") { if (qs[i].label && !confirm("Poistetaanko kysymys?")) return; qs.splice(i, 1); }
    renderEditor();
  };
}

function cleanQuestions(qs) {
  const used = new Set();
  return qs.map(q => {
    const out = { id: q.id, type: q.type, label: (q.label || "").trim(), required: !!q.required };
    if (!out.id) { let base = slugify(out.label).slice(0, 30) || "kysymys", id = base, n = 2; while (used.has(id) || qs.some(o => o !== q && o.id === id)) id = `${base}-${n++}`; out.id = id; }
    used.add(out.id);
    if (q.type === "radio" || q.type === "checkbox") out.options = (q.options || []).map(o => o.trim()).filter(Boolean);
    if (q.type === "scale") { out.min = Number.isFinite(q.min) ? q.min : 1; out.max = Number.isFinite(q.max) ? q.max : 5; if (q.minLabel) out.minLabel = q.minLabel.trim(); if (q.maxLabel) out.maxLabel = q.maxLabel.trim(); }
    return out;
  });
}

async function saveForm() {
  const d = draft, err = document.getElementById("eerr"); err.textContent = "";
  const questions = cleanQuestions(d.questions);
  const problems = [];
  if (!d.title.trim()) problems.push("Lomakkeelta puuttuu otsikko.");
  if (!/^[a-z0-9-]{2,60}$/.test(d.slug)) problems.push("Linkin tunnisteessa pitää olla 2–60 merkkiä (a–z, 0–9, -).");
  if (!questions.length) problems.push("Lisää vähintään yksi kysymys.");
  questions.forEach((q, i) => {
    if (!q.label) problems.push(`Kysymykseltä ${i + 1} puuttuu teksti.`);
    if (q.options && q.options.length < 2) problems.push(`Kysymyksessä ${i + 1} pitää olla vähintään kaksi vaihtoehtoa.`);
    if (q.type === "scale" && !(q.max > q.min && q.max - q.min <= 10)) problems.push(`Kysymyksen ${i + 1} asteikko on virheellinen (enintään 11 askelta).`);
  });
  if (problems.length) { err.innerHTML = problems.map(esc).join("<br>"); err.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

  const row = { title: d.title.trim(), slug: d.slug, description: (d.description || "").trim() || null, thank_you: (d.thank_you || "").trim() || "Kiitos vastauksestasi!", is_open: d.is_open, questions };
  const btns = [...document.querySelectorAll("#save,#save2")]; btns.forEach(b => b.disabled = true);
  const res = d.id ? await sb.from("forms").update(row).eq("id", d.id).select("id").single()
                   : await sb.from("forms").insert(row).select("id").single();
  btns.forEach(b => b.disabled = false);
  if (res.error) { err.textContent = res.error.code === "23505" ? "Tämä linkin tunniste on jo käytössä. Valitse toinen." : "Tallennus epäonnistui: " + res.error.message; return; }
  toast("Tallennettu");
  location.hash = "#/";
}

async function deleteForm() {
  if (!confirm(`Poistetaanko lomake "${draft.title}" ja KAIKKI sen vastaukset pysyvästi? Tätä ei voi perua.`)) return;
  const { error } = await sb.from("forms").delete().eq("id", draft.id);
  if (error) return toast("Poisto epäonnistui");
  toast("Lomake poistettu"); location.hash = "#/";
}

// ---------- Vastaukset ----------
const fmtVal = v => Array.isArray(v) ? v.join(", ") : (v ?? "");

async function responsesView(id) {
  app.innerHTML = `<p class="empty">Ladataan…</p>`;
  const [{ data: form, error: e1 }, { data: rows, error: e2 }] = await Promise.all([
    sb.from("forms").select("id,title,slug,questions,is_open").eq("id", id).single(),
    sb.from("responses").select("id,created_at,answers").eq("form_id", id).order("created_at", { ascending: false }).limit(5000)
  ]);
  if (e1 || e2) { app.innerHTML = `<p class="err">Lataus epäonnistui.</p>`; return; }
  const qs = form.questions || [];

  const summary = qs.filter(q => ["scale", "radio", "checkbox"].includes(q.type)).map(q => {
    const vals = rows.map(r => r.answers?.[q.id]).filter(v => v !== undefined && v !== "" && !(Array.isArray(v) && !v.length));
    if (q.type === "scale") {
      const nums = vals.map(Number).filter(Number.isFinite);
      const avg = nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length) : null;
      const counts = []; for (let i = q.min ?? 1; i <= (q.max ?? 5); i++) counts.push([String(i), nums.filter(n => n === i).length]);
      return { q, avg, counts, n: nums.length };
    }
    const flat = vals.flat(); const counts = (q.options || []).map(o => [o, flat.filter(v => v === o).length]);
    return { q, counts, n: vals.length };
  });

  app.innerHTML = `
    <div class="row" style="margin-bottom:18px"><a class="btn small" href="#/">← Takaisin</a><span class="spacer"></span>
      <button class="small" id="cp">Kopioi linkki</button>
      <a class="btn small" href="#/edit/${form.id}">Muokkaa</a>
      <button class="primary small" id="csv" ${rows.length ? "" : "disabled"}>Lataa CSV</button></div>
    <h2>${esc(form.title)}</h2>
    <p class="sub">${rows.length} vastausta · ${form.is_open ? "auki" : "suljettu"}</p>
    ${summary.length && rows.length ? `<div class="sum">${summary.map(s => {
      const max = Math.max(1, ...s.counts.map(c => c[1]));
      return `<div class="card"><h4>${esc(s.q.label)}</h4>
        ${s.avg != null ? `<div class="big">${s.avg.toFixed(1).replace(".", ",")}</div><div class="hint" style="margin-bottom:8px">keskiarvo · ${s.n} vastausta</div>` : `<div class="hint" style="margin-bottom:8px">${s.n} vastaajaa</div>`}
        ${s.counts.map(([l, c]) => `<div class="barrow"><div class="track"><div class="fill" style="width:${(c / max) * 100}%"></div><span class="lbl">${esc(l)}</span></div><b>${c}</b></div>`).join("")}
      </div>`; }).join("")}</div>` : ""}
    ${rows.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Aika</th>${qs.map(q => `<th>${esc(q.label)}</th>`).join("")}<th></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td style="white-space:nowrap">${fmtDate(r.created_at)}</td>${qs.map(q => `<td>${esc(fmtVal(r.answers?.[q.id]))}</td>`).join("")}<td><button class="small danger" data-del="${r.id}" title="Poista vastaus">✕</button></td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="card empty">Ei vielä vastauksia.</div>`}`;

  document.getElementById("cp").onclick = () => copy(publicLink(form.slug));
  const csvBtn = document.getElementById("csv");
  if (csvBtn) csvBtn.onclick = () => {
    const cell = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [["Aika", ...qs.map(q => q.label)].map(cell).join(";")]
      .concat(rows.map(r => [fmtDate(r.created_at), ...qs.map(q => fmtVal(r.answers?.[q.id]))].map(cell).join(";")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${form.slug}-vastaukset.csv`; a.click();
  };
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Poistetaanko tämä vastaus pysyvästi?")) return;
    const { error } = await sb.from("responses").delete().eq("id", b.dataset.del);
    if (error) return toast("Poisto epäonnistui");
    toast("Vastaus poistettu"); responsesView(id);
  });
}

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") loginView(); });
route();
</script>
</body>
</html>
