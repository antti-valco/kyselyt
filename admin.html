<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15233E">
<title>Valco · Kyselyjen hallinta</title>
<link rel="stylesheet" href="valco.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .bar { position: sticky; top: 0; z-index: 100; backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); background: rgba(21,35,62,0.55); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1080px; margin: 0 auto; padding: 14px var(--sp-page-x); display: flex; align-items: center; gap: 16px; }
  .bar-in a.home { display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .bar-in .sep { width: 1px; height: 20px; background: var(--line); }
  .who { color: var(--fg-3); font-size: 14px; }
  .spacer { flex: 1; }
  main { max-width: 1080px; margin: 0 auto; padding: 40px var(--sp-page-x) 80px; }
  .head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .head .t { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 260px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: var(--sp-gap); }
  .stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: var(--sp-gap); margin-bottom: 28px; }
  .stats .v-card, .stats .v-card-highlight { display: flex; flex-direction: column; gap: 10px; justify-content: space-between; min-height: 150px; }
  .stats .big { font-size: 56px; }
  .formcard { display: grid; grid-template-columns: 1fr auto auto; gap: 20px; align-items: center; }
  .formcard .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; color: var(--fg-3); font-size: 13px; }
  .formcard .count { text-align: right; }
  .formcard .count .v-num { font-size: 40px; display: block; }
  .formcard .count span { color: var(--fg-3); font-size: 12px; }
  .formcard .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 330px; }
  .login { max-width: 420px; margin: 8vh auto; display: flex; flex-direction: column; gap: 18px; }
  .login .v-card { display: flex; flex-direction: column; gap: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sect { display: flex; flex-direction: column; gap: 14px; }
  .sect + .sect { margin-top: var(--sp-gap); }
  .sect-title { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 14px; }
  .q { display: flex; flex-direction: column; gap: 12px; }
  .q .qtop { display: grid; grid-template-columns: 34px 1fr 200px; gap: 10px; align-items: center; }
  .q .num { font: 600 12px/1 var(--font-sans); letter-spacing: .14em; color: var(--fg-3); }
  .q .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--fg-2); }
  .savebar { position: sticky; bottom: 16px; margin-top: 24px; display: flex; gap: 10px; align-items: center; padding: 12px 12px 12px 18px; border-radius: 18px; background: rgba(21,35,62,0.75); backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: 0 20px 40px -20px rgba(0,0,0,.6); }
  .sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-gap); margin-bottom: 24px; }
  .sum .v-card { display: flex; flex-direction: column; gap: 10px; }
  .sum .avg { font-size: 52px; }
  .brow { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 10px; align-items: end; font-size: 13px; }
  .brow b { line-height: 22px; }
  .brow .lbl { color: var(--fg-2); margin-bottom: 4px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow: auto; max-height: 70vh; padding: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: #1d2647; font-weight: 500; color: var(--fg-2); font-size: 13px; z-index: 1; }
  tr:last-child td { border-bottom: 0; }
  td.when { white-space: nowrap; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .empty { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 48px 24px; }
  .errline { color: var(--err); font-size: 14px; }
  .nav { display: inline-flex; gap: 2px; padding: 4px; border-radius: var(--radius-pill); background: var(--btn-secondary-bg); border: 1px solid var(--btn-secondary-border); margin-left: 8px; }
  .nav a { font: 500 14px/1 var(--font-sans); padding: 9px 14px; border-radius: var(--radius-pill); color: var(--fg-2); text-decoration: none; white-space: nowrap; }
  .nav a:hover { color: var(--fg-1); }
  .nav a.is-on { background: var(--fg-1); color: #171717; }
  .narrow { max-width: 560px; }
  .ulist { display: flex; flex-direction: column; }
  .urow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .urow:first-child { border-top: 0; padding-top: 0; }
  .urow .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--grad-kuolemantahti); font-weight: 500; flex: none; text-transform: uppercase; }
  .urow .info { flex: 1; min-width: 0; }
  .urow .info b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; }
  .urow .info span { color: var(--fg-3); font-size: 13px; }
  .creds { font: 400 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(0,0,0,0.25); border-radius: var(--radius-md); padding: 12px 14px; white-space: pre-wrap; word-break: break-all; }
  .pwrow { display: flex; gap: 8px; }
  .pwrow .v-input { flex: 1; }
  .ok-banner { background: var(--ok-bg); color: var(--ok); }
  @media (max-width: 800px) { .nav { order: 3; width: 100%; margin: 8px 0 0; justify-content: space-between; } .nav a { flex: 1; text-align: center; } .bar-in { flex-wrap: wrap; } }
  @media (max-width: 800px) {
    .stats { grid-template-columns: 1fr; }
    .formcard { grid-template-columns: 1fr auto; }
    .formcard .acts { grid-column: 1 / -1; justify-content: flex-start; max-width: none; }
    .grid2 { grid-template-columns: 1fr; }
    .grid4 { grid-template-columns: 1fr 1fr; }
    .q .qtop { grid-template-columns: 1fr; }
    .who { display: none; }
  }
</style>
</head>
<body data-surface="ilta" data-colour="2" data-density="compact">
<header class="bar" id="hdr" hidden>
  <div class="bar-in">
    <a class="home" href="#/"><span class="v-logo">valco</span><span class="sep"></span><span class="v-eyebrow">Kyselyt</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="">Lomakkeet</a>
      <a href="#/users" data-nav="users">Käyttäjät</a>
      <a href="#/account" data-nav="account">Oma tili</a>
    </nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="v-btn v-btn-ghost v-btn-sm" id="logout">Kirjaudu ulos</button>
  </div>
</header>
<main id="app"><div class="v-skeleton" style="height:200px;margin-top:40px"></div></main>
<div class="v-toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://fqksurogezjvmlmsgpfw.supabase.co";
const SUPABASE_KEY = "sb_publishable_6mYs1PfkTrT_Izo0nn816g_LbPMcZEU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PUBLIC_BASE = new URL("./", location.href).href;

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); };
const fmtDate = d => new Date(d).toLocaleString("fi-FI", { day:"numeric", month:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit" });
const fmtNum = n => new Intl.NumberFormat("fi-FI", { maximumFractionDigits: 1, minimumFractionDigits: 1 }).format(n);
const slugify = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
const publicLink = slug => `${PUBLIC_BASE}?f=${slug}`;
const pad = n => String(n).padStart(2, "0");
const TYPES = { text:"Lyhyt teksti", textarea:"Pitkä teksti", email:"Sähköposti", radio:"Yksi vaihtoehto", checkbox:"Monivalinta", scale:"Asteikko" };
const loading = () => { app.innerHTML = `<div class="stack" style="margin-top:8px"><div class="v-skeleton" style="height:48px;width:40%"></div><div class="v-skeleton" style="height:150px"></div><div class="v-skeleton" style="height:96px"></div><div class="v-skeleton" style="height:96px"></div></div>`; };

async function copy(text, msg = "Linkki kopioitu") { try { await navigator.clipboard.writeText(text); toast(msg); } catch { prompt("Kopioi:", text); } }

// ---------- Kirjautuminen ----------
function loginView(msg) {
  document.getElementById("hdr").hidden = true;
  app.innerHTML = `
    <div class="login v-rise">
      <span class="v-logo" style="width:120px;height:32px">valco</span>
      <span class="v-eyebrow v-eyebrow-dot">Kyselyt · hallinta</span>
      <h2>Kirjaudu komentosillalle.</h2>
      <p>Täältä ohjataan kyselyjä. Kuolemantähteä ohjataan toisesta huoneesta.</p>
      <form id="lf" class="v-card" style="margin-top:6px">
        <div class="v-field"><label for="em">Sähköposti</label><input class="v-input" type="email" id="em" autocomplete="username" required></div>
        <div class="v-field"><label for="pw">Salasana</label><input class="v-input" type="password" id="pw" autocomplete="current-password" required></div>
        ${msg ? `<div class="v-banner" role="alert">${esc(msg)}</div>` : ""}
        <button class="v-btn v-btn-block" style="margin-top:4px">Kirjaudu sisään</button>
      </form>
    </div>`;
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Kirjaudutaan…";
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) return loginView("Kirjautuminen epäonnistui. Tarkista sähköposti ja salasana.");
    route();
  };
}
document.getElementById("logout").onclick = async () => { await sb.auth.signOut(); location.hash = "#/"; loginView(); };

async function requireAdmin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { loginView(); return false; }
  const { data, error } = await sb.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
  if (error || !data) { await sb.auth.signOut(); loginView("Tällä tunnuksella ei ole ylläpito-oikeuksia."); return false; }
  document.getElementById("hdr").hidden = false;
  document.getElementById("who").textContent = session.user.email;
  return true;
}

// ---------- Reititys ----------
async function route() {
  if (!(await requireAdmin())) return;
  const [, page, id] = (location.hash || "#/").slice(1).split("/");
  scrollTo(0, 0);
  const section = page === "users" || page === "account" ? page : "";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("is-on", a.dataset.nav === section));
  if (page === "edit") return editView(id);
  if (page === "responses") return responsesView(id);
  if (page === "users") return usersView();
  if (page === "account") return accountView();
  return listView();
}
window.addEventListener("hashchange", route);

// ---------- Lomakelista ----------
async function listView() {
  loading();
  const { data, error } = await sb.from("forms").select("id,slug,title,is_open,password,created_at,responses(count)").order("created_at", { ascending: false });
  if (error) { app.innerHTML = `<div class="v-banner" role="alert">Lomakkeiden lataus epäonnistui: ${esc(error.message)}</div>`; return; }
  const total = data.reduce((s, f) => s + (f.responses?.[0]?.count ?? 0), 0);
  const open = data.filter(f => f.is_open).length;
  app.innerHTML = `
    <div class="head v-rise">
      <div class="t">
        <span class="v-eyebrow v-eyebrow-dot">Komentosilta</span>
        <h1 class="v-two-tone">Lomakkeet <span>ja mitä niistä on sanottu.</span></h1>
      </div>
      <a class="v-btn" href="#/edit/new">Uusi lomake</a>
    </div>
    ${data.length ? `
    <div class="stats">
      <div class="v-card-highlight"><span class="v-eyebrow" style="color:rgba(255,255,255,.8)">Vastauksia yhteensä</span><span class="v-num big">${total}</span></div>
      <div class="v-card"><span class="v-eyebrow">Auki nyt</span><span class="v-num big">${open}</span></div>
      <div class="v-card"><span class="v-eyebrow">Lomakkeita</span><span class="v-num big">${data.length}</span></div>
    </div>
    <div class="stack">${data.map(f => {
      const n = f.responses?.[0]?.count ?? 0;
      return `<div class="v-card formcard">
        <div style="min-width:0">
          <h3>${esc(f.title)}</h3>
          <div class="meta">
            ${f.is_open ? '<span class="v-status v-status-success">Auki</span>' : '<span class="v-status">Suljettu</span>'}
            ${f.password ? `<span class="v-tag" title="Lomakkeen salasana">Salasana: ${esc(f.password)}</span>` : ""}
            <span>?f=${esc(f.slug)}</span><span>·</span><span>luotu ${fmtDate(f.created_at)}</span>
          </div>
        </div>
        <div class="count"><span class="v-num">${n}</span><span>vastausta</span></div>
        <div class="acts">
          <a class="v-btn v-btn-sm" href="#/responses/${f.id}">Vastaukset</a>
          <a class="v-btn v-btn-secondary v-btn-sm" href="#/edit/${f.id}">Muokkaa</a>
          <button class="v-btn v-btn-secondary v-btn-sm" data-copy="${esc(f.slug)}" data-pw="${esc(f.password || "")}">Kopioi linkki</button>
          <a class="v-btn v-btn-ghost v-btn-sm" href="${esc(publicLink(f.slug))}" target="_blank" rel="noopener">Avaa ↗</a>
        </div>
      </div>`;
    }).join("")}</div>` : `
    <div class="v-card-quiet empty">
      <h3>Ei vielä yhtään lomaketta.</h3>
      <p>Hiljaista kuin vastamelukuulokkeissa. Tehdään ensimmäinen.</p>
      <a class="v-btn" href="#/edit/new" style="margin-top:10px">Uusi lomake</a>
    </div>`}`;
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const link = publicLink(b.dataset.copy);
    copy(b.dataset.pw ? `${link}\nSalasana: ${b.dataset.pw}` : link, b.dataset.pw ? "Linkki ja salasana kopioitu" : "Linkki kopioitu");
  });
}

// ---------- Editori ----------
let draft = null;
function newQuestion(type = "text") { return { id: "", type, label: "", required: false, options: type === "radio" || type === "checkbox" ? ["", ""] : undefined }; }

async function editView(id) {
  if (id === "new") {
    draft = { id: null, title: "", slug: "", description: "", thank_you: "Kiitos vastauksestasi!", is_open: true, password: "", questions: [newQuestion()], _slugTouched: false, _hasResponses: false };
  } else {
    loading();
    const { data, error } = await sb.from("forms").select("*,responses(count)").eq("id", id).single();
    if (error) { app.innerHTML = `<div class="v-banner" role="alert">Lomaketta ei löytynyt.</div>`; return; }
    draft = { ...data, questions: structuredClone(data.questions || []), _slugTouched: true, _hasResponses: (data.responses?.[0]?.count ?? 0) > 0 };
    delete draft.responses;
  }
  renderEditor();
}

function qHtml(q, i, total) {
  const opts = q.type === "radio" || q.type === "checkbox";
  return `<div class="v-card q" data-i="${i}">
    <div class="qtop">
      <span class="num">${pad(i + 1)}</span>
      <input class="v-input" type="text" data-k="label" placeholder="Kirjoita kysymys" value="${esc(q.label)}" aria-label="Kysymys ${i + 1}">
      <select class="v-input" data-k="type" aria-label="Kysymyksen tyyppi">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    </div>
    ${opts ? `<div class="v-field"><label>Vaihtoehdot, yksi per rivi</label><textarea class="v-input" data-k="options" rows="4" style="min-height:100px">${esc((q.options || []).join("\n"))}</textarea></div>` : ""}
    ${q.type === "scale" ? `<div class="grid4">
      <div class="v-field"><label>Pienin</label><input class="v-input" type="number" data-k="min" value="${q.min ?? 1}"></div>
      <div class="v-field"><label>Suurin</label><input class="v-input" type="number" data-k="max" value="${q.max ?? 5}"></div>
      <div class="v-field"><label>Teksti alussa</label><input class="v-input" type="text" data-k="minLabel" value="${esc(q.minLabel || "")}" placeholder="esim. Huono"></div>
      <div class="v-field"><label>Teksti lopussa</label><input class="v-input" type="text" data-k="maxLabel" value="${esc(q.maxLabel || "")}" placeholder="esim. Erinomainen"></div>
    </div>` : ""}
    <div class="tools">
      <label class="toggle"><input class="v-switch" type="checkbox" data-k="required" ${q.required ? "checked" : ""}> Pakollinen</label>
      <span class="spacer"></span>
      <button type="button" class="v-btn v-btn-ghost v-btn-sm" data-act="up" ${i === 0 ? "disabled" : ""} aria-label="Siirrä ylös">↑</button>
      <button type="button" class="v-btn v-btn-ghost v-btn-sm" data-act="down" ${i === total - 1 ? "disabled" : ""} aria-label="Siirrä alas">↓</button>
      <button type="button" class="v-btn v-btn-ghost v-btn-sm" data-act="dup">Monista</button>
      <button type="button" class="v-btn v-btn-danger v-btn-sm" data-act="del">Poista</button>
    </div>
  </div>`;
}

function renderEditor() {
  const d = draft;
  app.innerHTML = `
    <div class="head">
      <div class="t">
        <a class="v-btn v-btn-ghost v-btn-sm" href="#/" style="align-self:flex-start;margin-left:-12px">← Lomakkeet</a>
        <h1>${d.id ? esc(d.title || "Muokkaa lomaketta") : "Uusi lomake"}</h1>
        ${d._hasResponses ? `<p>Lomakkeella on jo vastauksia. Tekstejä voi muokata ja kysymyksiä lisätä vapaasti. Poistetun kysymyksen vanhat vastaukset katoavat näkymästä.</p>` : ""}
      </div>
    </div>

    <div class="v-card sect">
      <h3>Perustiedot</h3>
      <div class="v-field"><label for="title">Otsikko</label><input class="v-input" type="text" id="title" value="${esc(d.title)}" placeholder="esim. Miten onnistuimme?"></div>
      <div class="v-field"><label for="desc">Kuvaus</label><textarea class="v-input" id="desc" placeholder="Näkyy otsikon alla. Vapaaehtoinen.">${esc(d.description || "")}</textarea></div>
      <div class="v-field"><label for="ty">Kiitosteksti</label><input class="v-input" type="text" id="ty" value="${esc(d.thank_you || "")}"><small>Näkyy isona otsikkona, kun vastaus on lähetetty.</small></div>
    </div>
    <div class="v-card sect">
      <h3>Jakaminen</h3>
      <div class="grid2">
        <div class="v-field"><label for="slug">Linkin tunniste</label><input class="v-input" type="text" id="slug" value="${esc(d.slug)}" placeholder="esim. asiakaspalaute"><small id="slugPrev">${esc(publicLink(d.slug || "…"))}</small></div>
        <div class="v-field"><label for="pwd">Salasana</label><input class="v-input" type="text" id="pwd" value="${esc(d.password || "")}" placeholder="Tyhjä = kaikille avoin" autocomplete="off" spellcheck="false"><small>Kirjainkoolla ei ole väliä.</small></div>
      </div>
      <label class="toggle" style="margin-top:4px"><input class="v-switch" type="checkbox" id="open" ${d.is_open ? "checked" : ""}> Lomake on auki vastauksille</label>
    </div>

    <div class="sect-title"><h2>Kysymykset</h2><span class="muted" id="qcount">${d.questions.length}</span></div>
    <div class="stack" id="qs">${d.questions.map((q, i) => qHtml(q, i, d.questions.length)).join("")}</div>
    <button class="v-btn v-btn-secondary v-btn-block" id="addQ" style="margin-top:var(--sp-gap)">Lisää kysymys</button>

    <div class="savebar">
      <span class="errline" id="eerr" role="alert"></span>
      <span class="spacer"></span>
      ${d.id ? `<button class="v-btn v-btn-danger v-btn-sm" id="delForm">Poista lomake</button>` : ""}
      <button class="v-btn" id="save">Tallenna</button>
    </div>`;

  const $ = id => document.getElementById(id);
  $("title").oninput = e => { d.title = e.target.value; if (!d._slugTouched) { d.slug = slugify(d.title); $("slug").value = d.slug; $("slugPrev").textContent = publicLink(d.slug || "…"); } };
  $("slug").oninput = e => { d._slugTouched = true; d.slug = slugify(e.target.value); $("slugPrev").textContent = publicLink(d.slug || "…"); };
  $("slug").onblur = e => { e.target.value = d.slug; };
  $("desc").oninput = e => d.description = e.target.value;
  $("ty").oninput = e => d.thank_you = e.target.value;
  $("pwd").oninput = e => d.password = e.target.value;
  $("open").onchange = e => d.is_open = e.target.checked;
  $("addQ").onclick = () => { d.questions.push(newQuestion()); renderEditor(); const el = document.querySelector(`.q[data-i="${d.questions.length - 1}"] input`); el?.focus(); el?.scrollIntoView({ block: "center" }); };
  $("save").onclick = saveForm;
  if ($("delForm")) $("delForm").onclick = deleteForm;

  $("qs").oninput = $("qs").onchange = e => {
    const box = e.target.closest(".q"); if (!box) return;
    const q = d.questions[+box.dataset.i], k = e.target.dataset.k; if (!k) return;
    if (k === "required") q.required = e.target.checked;
    else if (k === "options") q.options = e.target.value.split("\n");
    else if (k === "min" || k === "max") q[k] = Number(e.target.value);
    else if (k === "type") {
      if (e.type !== "change") return;
      q.type = e.target.value;
      if ((q.type === "radio" || q.type === "checkbox") && !q.options) q.options = ["", ""];
      if (q.type === "scale") { q.min ??= 1; q.max ??= 5; }
      renderEditor();
    } else q[k] = e.target.value;
  };
  $("qs").onclick = e => {
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const act = btn.dataset.act, i = +btn.closest(".q").dataset.i, qs = d.questions;
    if (act === "up") [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]];
    if (act === "down") [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]];
    if (act === "dup") qs.splice(i + 1, 0, { ...structuredClone(qs[i]), id: "" });
    if (act === "del") { if (qs[i].label && !confirm("Poistetaanko kysymys?")) return; qs.splice(i, 1); }
    renderEditor();
  };
}

function cleanQuestions(qs) {
  const used = new Set();
  return qs.map(q => {
    const out = { id: q.id, type: q.type, label: (q.label || "").trim(), required: !!q.required };
    if (!out.id) { let base = slugify(out.label).slice(0, 30) || "kysymys", id = base, n = 2; while (used.has(id) || qs.some(o => o !== q && o.id === id)) id = `${base}-${n++}`; out.id = id; }
    used.add(out.id);
    if (q.type === "radio" || q.type === "checkbox") out.options = (q.options || []).map(o => o.trim()).filter(Boolean);
    if (q.type === "scale") { out.min = Number.isFinite(q.min) ? q.min : 1; out.max = Number.isFinite(q.max) ? q.max : 5; if (q.minLabel) out.minLabel = q.minLabel.trim(); if (q.maxLabel) out.maxLabel = q.maxLabel.trim(); }
    return out;
  });
}

async function saveForm() {
  const d = draft, err = document.getElementById("eerr"); err.textContent = "";
  const questions = cleanQuestions(d.questions);
  const problems = [];
  if (!d.title.trim()) problems.push("Lomakkeelta puuttuu otsikko.");
  if (!/^[a-z0-9-]{2,60}$/.test(d.slug)) problems.push("Linkin tunnisteessa pitää olla 2–60 merkkiä (a–z, 0–9, -).");
  if (!questions.length) problems.push("Lisää vähintään yksi kysymys.");
  questions.forEach((q, i) => {
    if (!q.label) problems.push(`Kysymykseltä ${i + 1} puuttuu teksti.`);
    if (q.options && q.options.length < 2) problems.push(`Kysymyksessä ${i + 1} pitää olla vähintään kaksi vaihtoehtoa.`);
    if (q.type === "scale" && !(q.max > q.min && q.max - q.min <= 10)) problems.push(`Kysymyksen ${i + 1} asteikko on virheellinen (enintään 11 askelta).`);
  });
  if (problems.length) { err.textContent = problems[0] + (problems.length > 1 ? ` (+${problems.length - 1} muuta)` : ""); return; }

  const row = { title: d.title.trim(), slug: d.slug, description: (d.description || "").trim() || null, thank_you: (d.thank_you || "").trim() || "Kiitos vastauksestasi!", is_open: d.is_open, password: (d.password || "").trim() || null, questions };
  const btn = document.getElementById("save"); btn.disabled = true; btn.textContent = "Tallennetaan…";
  const res = d.id ? await sb.from("forms").update(row).eq("id", d.id).select("id").single()
                   : await sb.from("forms").insert(row).select("id").single();
  btn.disabled = false; btn.textContent = "Tallenna";
  if (res.error) { err.textContent = res.error.code === "23505" ? "Tämä linkin tunniste on jo käytössä. Valitse toinen." : "Tallennus epäonnistui: " + res.error.message; return; }
  toast("Tallennettu");
  location.hash = "#/";
}

async function deleteForm() {
  if (!confirm(`Poistetaanko lomake "${draft.title}" ja KAIKKI sen vastaukset pysyvästi? Tätä ei voi perua.`)) return;
  const { error } = await sb.from("forms").delete().eq("id", draft.id);
  if (error) return toast("Poisto epäonnistui");
  toast("Lomake poistettu"); location.hash = "#/";
}

// ---------- Vastaukset ----------
const fmtVal = v => Array.isArray(v) ? v.join(", ") : (v ?? "");

async function responsesView(id) {
  loading();
  const [{ data: form, error: e1 }, { data: rows, error: e2 }] = await Promise.all([
    sb.from("forms").select("id,title,slug,questions,is_open,password").eq("id", id).single(),
    sb.from("responses").select("id,created_at,answers").eq("form_id", id).order("created_at", { ascending: false }).limit(5000)
  ]);
  if (e1 || e2) { app.innerHTML = `<div class="v-banner" role="alert">Vastausten lataus epäonnistui.</div>`; return; }
  const qs = form.questions || [];

  const summary = qs.filter(q => ["scale", "radio", "checkbox"].includes(q.type)).map(q => {
    const vals = rows.map(r => r.answers?.[q.id]).filter(v => v !== undefined && v !== "" && !(Array.isArray(v) && !v.length));
    if (q.type === "scale") {
      const nums = vals.map(Number).filter(Number.isFinite);
      const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
      const counts = []; for (let i = q.min ?? 1; i <= (q.max ?? 5); i++) counts.push([String(i), nums.filter(n => n === i).length]);
      return { q, avg, counts, n: nums.length };
    }
    const flat = vals.flat(); const counts = (q.options || []).map(o => [o, flat.filter(v => v === o).length]);
    return { q, counts, n: vals.length };
  });

  app.innerHTML = `
    <div class="head">
      <div class="t">
        <a class="v-btn v-btn-ghost v-btn-sm" href="#/" style="align-self:flex-start;margin-left:-12px">← Lomakkeet</a>
        <h1>${esc(form.title)}</h1>
        <div class="row">
          ${form.is_open ? '<span class="v-status v-status-success">Auki</span>' : '<span class="v-status">Suljettu</span>'}
          <span class="muted" style="font-size:14px">${rows.length} ${rows.length === 1 ? "vastaus" : "vastausta"}</span>
        </div>
      </div>
      <div class="row">
        <button class="v-btn v-btn-secondary v-btn-sm" id="cp">Kopioi linkki</button>
        <a class="v-btn v-btn-secondary v-btn-sm" href="#/edit/${form.id}">Muokkaa</a>
        <button class="v-btn v-btn-sm" id="csv" ${rows.length ? "" : "disabled"}>Lataa CSV</button>
      </div>
    </div>
    ${summary.length && rows.length ? `<div class="sum">${summary.map(s => {
      const max = Math.max(1, ...s.counts.map(c => c[1]));
      const top = Math.max(...s.counts.map(c => c[1]));
      return `<div class="v-card">
        <span class="v-eyebrow">${esc(s.q.label)}</span>
        ${s.avg != null ? `<div class="row" style="align-items:baseline;gap:10px"><span class="v-num avg">${fmtNum(s.avg)}</span><span class="muted" style="font-size:13px">keskiarvo · ${s.n} vastausta</span></div>` : `<span class="muted" style="font-size:13px">${s.n} vastaajaa</span>`}
        <div class="stack" style="gap:8px">${s.counts.map(([l, c]) => `<div class="brow"><div><span class="lbl">${esc(l)}</span><div class="v-bar ${c === top && c > 0 ? "is-key" : ""}"><i style="width:${(c / max) * 100}%"></i></div></div><b>${c}</b></div>`).join("")}</div>
      </div>`; }).join("")}</div>` : ""}
    ${rows.length ? `<div class="v-card tablewrap"><table>
      <thead><tr><th>Aika</th>${qs.map(q => `<th>${esc(q.label)}</th>`).join("")}<th></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="when">${fmtDate(r.created_at)}</td>${qs.map(q => `<td>${esc(fmtVal(r.answers?.[q.id]))}</td>`).join("")}<td><button class="v-btn v-btn-ghost v-btn-sm" data-del="${r.id}" aria-label="Poista vastaus" title="Poista vastaus">✕</button></td></tr>`).join("")}</tbody>
    </table></div>` : `
    <div class="v-card-quiet empty">
      <h3>Ei vielä vastauksia.</h3>
      <p>Lähetä linkki jollekulle, jolla on hetki aikaa. Tai kahvitauko.</p>
      <button class="v-btn v-btn-secondary" id="cp2" style="margin-top:10px">Kopioi linkki</button>
    </div>`}`;

  const copyLink = () => copy(form.password ? `${publicLink(form.slug)}\nSalasana: ${form.password}` : publicLink(form.slug), form.password ? "Linkki ja salasana kopioitu" : "Linkki kopioitu");
  document.getElementById("cp").onclick = copyLink;
  if (document.getElementById("cp2")) document.getElementById("cp2").onclick = copyLink;
  const csvBtn = document.getElementById("csv");
  if (csvBtn) csvBtn.onclick = () => {
    const cell = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [["Aika", ...qs.map(q => q.label)].map(cell).join(";")]
      .concat(rows.map(r => [fmtDate(r.created_at), ...qs.map(q => fmtVal(r.answers?.[q.id]))].map(cell).join(";")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${form.slug}-vastaukset.csv`; a.click();
  };
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Poistetaanko tämä vastaus pysyvästi?")) return;
    const { error } = await sb.from("responses").delete().eq("id", b.dataset.del);
    if (error) return toast("Poisto epäonnistui");
    toast("Vastaus poistettu"); responsesView(id);
  });
}

// ---------- Käyttäjät ----------
async function adminApi(body) {
  const { data, error } = await sb.functions.invoke("admin-users", { body });
  if (error) {
    let code = error.message;
    try { const j = await error.context.json(); code = j.error || code; } catch {}
    throw new Error(code);
  }
  return data;
}
const API_ERRORS = {
  exists: "Tällä sähköpostilla on jo tunnus.",
  invalid_email: "Tarkista sähköpostiosoite.",
  weak_password: "Salasanassa pitää olla vähintään 8 merkkiä.",
  self: "Omaa tunnusta ei voi poistaa täältä.",
  forbidden: "Sinulla ei ole oikeutta hallita käyttäjiä.",
  not_authenticated: "Kirjautuminen on vanhentunut. Kirjaudu uudelleen.",
};
const apiMsg = e => API_ERRORS[e.message] || "Jokin meni pieleen: " + e.message;
function genPassword() {
  const chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(12); crypto.getRandomValues(a);
  return [...a].map(n => chars[n % chars.length]).join("");
}

async function usersView() {
  loading();
  let users;
  try { users = (await adminApi({ action: "list" })).users; }
  catch (e) { app.innerHTML = `<div class="v-banner" role="alert">${esc(apiMsg(e))}</div>`; return; }
  app.innerHTML = `
    <div class="head v-rise">
      <div class="t">
        <span class="v-eyebrow v-eyebrow-dot">Miehistö</span>
        <h1 class="v-two-tone">Käyttäjät <span>komentosillalla.</span></h1>
      </div>
    </div>
    <div class="grid2" style="align-items:start">
      <div class="v-card">
        <h3 style="margin-bottom:14px">${users.length} ${users.length === 1 ? "käyttäjä" : "käyttäjää"}</h3>
        <div class="ulist">${users.map(u => `
          <div class="urow">
            <span class="avatar" aria-hidden="true">${esc((u.email || "?")[0])}</span>
            <div class="info">
              <b>${esc(u.email)}</b>
              <span>${u.last_sign_in_at ? "Viimeksi paikalla " + fmtDate(u.last_sign_in_at) : "Ei ole vielä kirjautunut"}</span>
            </div>
            ${u.me ? '<span class="v-tag">Sinä</span>' : `<button class="v-btn v-btn-danger v-btn-sm" data-del="${esc(u.id)}" data-email="${esc(u.email)}">Poista</button>`}
          </div>`).join("")}
        </div>
      </div>
      <form class="v-card sect" id="uf" novalidate>
        <h3>Lisää käyttäjä</h3>
        <p style="font-size:14px">Uusi käyttäjä saa samat oikeudet kuin sinä: lomakkeet, vastaukset ja käyttäjät.</p>
        <div class="v-field"><label for="nemail">Sähköposti</label><input class="v-input" type="email" id="nemail" autocomplete="off" placeholder="nimi@valco.fi"></div>
        <div class="v-field"><label for="npw">Väliaikainen salasana</label>
          <div class="pwrow"><input class="v-input" type="text" id="npw" autocomplete="off" spellcheck="false" value="${genPassword()}"><button type="button" class="v-btn v-btn-secondary" id="regen" title="Luo uusi salasana">Uusi</button></div>
          <small>Vähintään 8 merkkiä. Käyttäjä voi vaihtaa sen kohdasta Oma tili.</small>
        </div>
        <div class="errline" id="uerr" role="alert"></div>
        <button class="v-btn" type="submit">Lisää käyttäjä</button>
        <div id="created"></div>
      </form>
    </div>`;

  document.getElementById("regen").onclick = () => { document.getElementById("npw").value = genPassword(); };
  document.getElementById("uf").onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById("nemail").value.trim(), password = document.getElementById("npw").value;
    const err = document.getElementById("uerr"); err.textContent = "";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = API_ERRORS.invalid_email; return; }
    if (password.length < 8) { err.textContent = API_ERRORS.weak_password; return; }
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Lisätään…";
    try {
      await adminApi({ action: "create", email, password });
      const creds = `Kyselyjen hallinta: ${location.href.split("#")[0]}\nSähköposti: ${email}\nSalasana: ${password}`;
      await usersView();
      toast("Käyttäjä lisätty");
      document.getElementById("created").innerHTML = `
        <div class="v-banner ok-banner" style="flex-direction:column;gap:10px;margin-top:4px">
          <b>Tunnus luotu. Lähetä nämä tiedot uudelle käyttäjälle:</b>
          <div class="creds" id="credtxt">${esc(creds)}</div>
          <button type="button" class="v-btn v-btn-sm" id="copycreds" style="align-self:flex-start">Kopioi tiedot</button>
        </div>`;
      document.getElementById("copycreds").onclick = () => copy(creds, "Tiedot kopioitu");
    } catch (ex) {
      err.textContent = apiMsg(ex);
      btn.disabled = false; btn.textContent = "Lisää käyttäjä";
    }
  };
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`Poistetaanko käyttäjä ${b.dataset.email}? Hän ei pääse enää kirjautumaan. Lomakkeet ja vastaukset säilyvät.`)) return;
    b.disabled = true;
    try { await adminApi({ action: "delete", id: b.dataset.del }); toast("Käyttäjä poistettu"); usersView(); }
    catch (ex) { b.disabled = false; toast(apiMsg(ex)); }
  });
}

// ---------- Oma tili ----------
async function accountView() {
  const { data: { session } } = await sb.auth.getSession();
  app.innerHTML = `
    <div class="head v-rise">
      <div class="t">
        <span class="v-eyebrow v-eyebrow-dot">Oma tili</span>
        <h1 class="v-two-tone">${esc(session.user.email)}</h1>
      </div>
    </div>
    <form class="v-card sect narrow" id="pf" novalidate>
      <h3>Vaihda salasana</h3>
      <p style="font-size:14px">Vähintään 8 merkkiä. Pidempi on parempi, ja "salasana123" on jo varattu.</p>
      <div class="v-field"><label for="p1">Uusi salasana</label><input class="v-input" type="password" id="p1" autocomplete="new-password"></div>
      <div class="v-field"><label for="p2">Uusi salasana uudelleen</label><input class="v-input" type="password" id="p2" autocomplete="new-password"></div>
      <div class="errline" id="perr" role="alert"></div>
      <button class="v-btn" type="submit" style="align-self:flex-start">Vaihda salasana</button>
    </form>`;
  document.getElementById("pf").onsubmit = async e => {
    e.preventDefault();
    const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value, err = document.getElementById("perr");
    err.textContent = "";
    if (p1.length < 8) { err.textContent = "Salasanassa pitää olla vähintään 8 merkkiä."; return; }
    if (p1 !== p2) { err.textContent = "Salasanat eivät täsmää."; return; }
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Vaihdetaan…";
    const { error } = await sb.auth.updateUser({ password: p1 });
    btn.disabled = false; btn.textContent = "Vaihda salasana";
    if (error) {
      err.textContent = /same|different/i.test(error.message) ? "Uusi salasana on sama kuin vanha." :
        /weak|short|characters/i.test(error.message) ? "Salasana on liian heikko. Kokeile pidempää." :
        /reauth|recent/i.test(error.message) ? "Kirjaudu ulos ja takaisin sisään, ja yritä sitten uudelleen." :
        "Vaihto epäonnistui: " + error.message;
      return;
    }
    e.target.reset();
    toast("Salasana vaihdettu");
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") loginView(); });
route();
